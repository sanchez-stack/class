<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>class</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                rgba(255, 255, 255, 0.03),
                rgba(255, 255, 255, 0.03) 1px,
                transparent 1px,
                transparent 3px
            );
            pointer-events: none;
            z-index: 10;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, #000 85%);
            pointer-events: none;
            z-index: 9;
        }

        .terminal {
            background: #050505;
            border: 1px solid #222;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.9);
            max-width: 720px;
            width: 95%;
            padding: 2.2rem;
            position: relative;
            z-index: 5;
        }

        .header {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 1.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .header span {
            color: #fff;
        }

        .prompt {
            color: #aaa;
            margin-bottom: 0.6rem;
            font-size: 0.95rem;
        }

        .prompt::before {
            content: "> ";
            color: #fff;
        }

        .code-block {
            background: #000;
            border: 1px solid #333;
            color: #fff;
            font-size: 1.1rem;
            padding: 1.5rem;
            margin: 1.8rem 0;
            letter-spacing: 1px;
            text-align: center;
        }

        .ig-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.5rem;
            display: block;
            opacity: 0.9;
        }

        label {
            display: block;
            color: #777;
            font-size: 0.85rem;
            margin-bottom: 0.6rem;
            letter-spacing: 1px;
        }

        .form-control {
            background: #000 !important;
            border: 1px solid #333 !important;
            color: #fff !important;
            font-family: 'Share Tech Mono', monospace !important;
            border-radius: 0 !important;
            padding: 0.9rem 1.1rem !important;
            font-size: 1.1rem !important;
        }

        .form-control:focus {
            box-shadow: 0 0 0 1px #fff !important;
            outline: none;
            border-color: #fff !important;
        }

        .form-control::placeholder {
            color: #333 !important;
        }

        .btn-submit {
            background: transparent;
            border: 1px solid #444;
            color: #ccc;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 3px;
            padding: 0.85rem 1.5rem;
            border-radius: 0;
            transition: all 0.2s ease;
            width: 100%;
            margin-top: 1.2rem;
            text-transform: uppercase;
        }

        .btn-submit:hover {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        #feedback {
            margin-top: 1.4rem;
            min-height: 1.5rem;
            font-size: 0.95rem;
            letter-spacing: 1.5px;
        }

        .blink {
            animation: blink 1.1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="terminal">
        <div class="header">
            SYSTEM // PART <span>04</span> OF 05 // STATUS: UNKNOWN
        </div>

        <div class="prompt">Something is missing.</div>

        <!-- Instagram Logo -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" 
             alt="Instagram" 
             class="ig-logo">

        <div class="code-block">
            &lt;span ________&gt;2odeee&lt;/span&gt;
        </div>

        <div>
            <label for="answer">> FILL IN THE BLANK:</label>
            <input type="text" 
                   class="form-control" 
                   id="answer" 
                   placeholder="type the missing part..." 
                   autocomplete="off"
                   spellcheck="false"
                   autofocus>
        </div>

        <button class="btn-submit" onclick="checkAnswer()">
            Submit
        </button>

        <p id="feedback"></p>
    </div>

    <script>
        function checkAnswer() {
            const input = document.getElementById("answer").value.trim();
            const feedback = document.getElementById("feedback");

            const correctAnswer = "x1lliihq x193iq5w x6ikm8r x10wlt62 xlyipyv xuxw1ft";

            if (input === correctAnswer) {
                feedback.style.color = "#fff";
                feedback.innerHTML = "> CORRECT <span class='blink'>_</span>";

                // Redirect after short delay
                setTimeout(() => {
                    window.location.href = "https://www.youtube.com/watch?v=s8t-9vlplLg";
                }, 1600);
            } else if (input === "") {
                feedback.style.color = "#888";
                feedback.textContent = "> SILENCE WILL NOT SAVE YOU";
            } else {
                feedback.style.color = "#888";
                feedback.textContent = "> WRONG. IT KNOWS YOU TRIED.";
            }
        }

        document.getElementById("answer").addEventListener("keydown", function(e) {
            if (e.key === "Enter") checkAnswer();
        });
    </script>
</body>
</html>
